[tools]
go = "1.25.1"

[tasks.build]
run = "go build -ldflags='-s -w' -o bin/pace ."

[tasks.test]
run = "go test -v ./..."

[tasks.install]
run = "go install -ldflags='-s -w' ."

[tasks.clean]
run = "rm -rf bin/"

[tasks.tui]
description = "Build and run the TUI from source against a throwaway store"
run = '''
go build -o bin/pace .
export PACE_DIR="${PACE_DIR:-$(mktemp -d)}"
echo "store: $PACE_DIR"
./bin/pace tui
'''
